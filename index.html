<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8c5a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Saunakaverit">
<meta name="description" content="Saunakaverit – yhdessä saunaan. Sunnuntaisaunat, teemasaunat ja yhteinen löylyhuone.">
<title>Saunakaverit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="css/app.css?v=0.10.1">
</head>
<body>
<div id="app">
  <header class="top">
    <a class="brand" href="#" id="brandHome">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="16" fill="#8c5a35"/>
        <path d="M14 40 L32 22 L50 40 Z" fill="#f6f1ea"/>
        <rect x="20" y="40" width="24" height="12" fill="#f6f1ea"/>
        <rect x="29" y="44" width="6" height="8" fill="#8c5a35"/>
        <path d="M26 20 c0 -4 4 -4 4 -8 M32 18 c0 -4 4 -4 4 -8 M38 20 c0 -4 4 -4 4 -8" stroke="#f6f1ea" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <span><b>Saunakaverit</b><small data-i18n="tagline">Yhdessä saunaan</small></span>
    </a>
    <button class="chipbtn" id="langBtn" title="Kieli / Language">EN</button>
    <button class="chipbtn ghost" id="themeBtn" title="Vaalea / tumma">◐</button>
  </header>

  <section class="view" id="view-home"></section>
  <section class="view active" id="view-room"></section>
  <section class="view" id="view-passport"></section>
  <section class="view" id="view-etiquette"></section>
  <section class="view" id="view-profile"></section>
</div>

<nav class="tabs">
  <div class="inner">
    <button data-view="room" class="active"><span class="ic">🧖</span><span data-i18n="tab.room">Löyly</span></button>
    <button data-view="home"><span class="ic">🔥</span><span data-i18n="tab.home">Saunat</span></button>
    <button data-view="host" class="fab"><span class="ic">＋</span><span data-i18n="tab.host">Isännöi</span></button>
    <button data-view="passport"><span class="ic">📖</span><span data-i18n="tab.passport">Passi</span></button>
    <button data-view="profile"><span class="ic">🙂</span><span data-i18n="tab.profile">Minä</span></button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=0.10.1"></script>
<script src="js/data.js?v=0.10.1"></script>
<script src="js/backend.js?v=0.10.1"></script>
<script src="js/room.js?v=0.10.1"></script>
<script src="js/app.js?v=0.10.1"></script>
</body>
</html>
